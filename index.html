<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-sclae=1.0">

        <title>Address Book Application</title>

        <link rel="stylesheet" href="style.css">    <!-- connect to CSS file -->
    </head>

    <body>
        <div class="container">

            <!-- Header -->
            <div class="header">
                <h1>Address Book</h1>
                <p>A Contact Management System Application</p>
            </div>

            <!-- List of Contacts Section -->
            <div class="card">
                <div class="contact-header">
                    <div>
                        <h2>My Contacts</h2>
                        <p id="contactCount">0 contacts</p>
                    </div>

                    <!-- Search -->
                    <input type="text" id="searchInput" placeholder="Search by name" autocomplete="off">
                </div>

                <!-- Contacts will appear in this section get from the javascript file -->
                <div id="contactList"></div>
            </div>

            <!-- Add Contact Section -->
            <div class="card">
                <h2>Add New Contact</h2>

                <form id="contactForm">
                    <div class="form-grid">

                        <!-- Name -->
                        <div class="form-group">
                            <label>Name:</label>
                            <input type="text" id="name" placeholder="Enter name" autocomplete="off" required>
                        </div>
                        
                        <!-- Phone -->
                        <div class="form-group">
                            <label>Phone:</label>
                            <input type="int" id="phone" placeholder="Enter phone number" autocomplete="off" required>
                        </div>
                        
                        <!-- Email -->
                        <div class="form-group">
                            <label>Email:</label>
                            <input type="email" id="email" placeholder="Enter email" autocomplete="off" required>
                        </div> 

                        <!-- Street -->
                        <div class="form-group">
                            <label>Street:</label>
                            <input type="text" id="street" placeholder="Enter street" autocomplete="off" required>
                        </div> 

                        <!-- State -->
                        <div class="form-group">
                            <label>State:</label>
                            <input type="text" id="state" placeholder="Enter state" autocomplete="off" required>
                        </div> 

                        <!-- Postcode -->
                        <div class="form-group">
                            <label>Postcode:</label>
                            <input type="int" id="postcode" placeholder="Enter postcode" autocomplete="off" required>
                        </div> 

                        <!-- Description -->
                        <div class="form-group">
                            <label>Description:</label>
                            <textarea id="description" placeholder="Enter description" autocomplete="off"></textarea>
                        </div>
                        
                        <button type="submit" class="add-btn">
                            Add Contact
                        </button>

                    </div>
                </form>
            </div>

        </div>

        <!-- connect to javascript file -->
        <script src="script.js"></script>

    </body>
</html>
